name: Frociest Rumble - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            liblzma-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            openjdk-17-jdk \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libltdl-dev \
            cmake \
            ninja-build

      - name: Installa Buildozer e Cython
        run: |
          pip3 install --upgrade pip setuptools
          pip3 install buildozer cython virtualenv

      - name: Cache Android SDK/NDK e dipendenze Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: |
            buildozer-

      - name: Debug - mostra struttura file
        run: |
          echo "=== Root del repository ==="
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec

      - name: Compila APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          echo "Exit code: $?"

      - name: Mostra log in caso di errore
        if: failure()
        run: |
          tail -100 build.log || true

      - name: Carica APK come artefatto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: FrociestRumble-beta0.1
          path: bin/*.apk
          retention-days: 30

      - name: Carica log di build (anche in caso di errore)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
