name: Frociest Rumble - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:  # permette di avviare manualmente dalla pagina GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout codice
        uses: actions/checkout@v3

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            liblzma-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            openjdk-17-jdk \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libltdl-dev

      - name: Installa Buildozer e Cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: Cache Android SDK/NDK e dipendenze Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Compila APK
        run: |
          buildozer -v android debug

      - name: Carica APK come artefatto scaricabile
        uses: actions/upload-artifact@v3
        with:
          name: FrociestRumble-beta0.1
          path: bin/*.apk
          retention-days: 30
